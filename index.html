<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Partner Support Hub</title>
    <style>
        :root { --primary: #0284c7; --bg: #f1f5f9; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); padding: 20px; color: #1e293b; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: var(--primary); border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #64748b; margin-bottom: 5px; display: block; }
        select, input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .output-box { border-top: 2px solid #e2e8f0; padding-top: 20px; display: none; }
        .copy-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        pre { 
            background: white; padding: 12px; border: 1px solid #cbd5e1; border-radius: 4px; 
            white-space: pre-wrap; word-break: break-all; overflow-wrap: break-word;
            font-family: 'Courier New', monospace; font-size: 14px; margin: 0; color: #334155;
        }
        .btn-copy { background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 12px; float: right; }
        .badge { color: #16a34a; font-size: 11px; font-weight: bold; float: right; margin-right: 10px; display: none; }
        .clearfix::after { content: ""; clear: both; display: table; }
    </style>
</head>
<body>

<div class="container">
    <h2>Partner Support Hub</h2>
    
    <div class="grid">
        <div class="input-group">
            <label>Select Partner</label>
            <select id="partnerKey" onchange="generate()">
                <option value="">-- Choose Partner --</option>
                <option value="NG_ZENITH">Nigeria - Zenith Bank</option>
                <option value="NG_ACCESS">Nigeria - Access Bank</option>
                <option value="GH_ABSA">Ghana - Absa</option>
                <option value="PH_GCASH">Philippines - GCash</option>
            </select>
        </div>
        <div class="input-group">
            <label>Service Type</label>
            <select id="service" onchange="generate()">
                <option value="Momo">Mobile Money (Momo)</option>
                <option value="Bank">Bank Transfer</option>
                <option value="Cash Pickup">Cash Pickup</option>
            </select>
        </div>
        <div class="input-group">
            <label>Issue Type</label>
            <select id="issue" onchange="generate()">
                <option value="funds">Funds Not Received</option>
                <option value="reversal">Reversal Request</option>
                <option value="assist">Assist Recipient Request</option>
                <option value="status">Status Confirmation</option>
            </select>
        </div>
    </div>

    <div class="grid">
        <div class="input-group"><label>Transaction Number</label><input type="text" id="txnNum" oninput="generate()"></div>
        <div class="input-group"><label>Partner ID / 3rd Party Ref</label><input type="text" id="ref" oninput="generate()"></div>
        <div class="input-group"><label>Recipient Name</label><input type="text" id="name" oninput="generate()"></div>
        <div class="input-group"><label>Amount</label><input type="text" id="amt" oninput="generate()"></div>
        <div class="input-group"><label id="accLabel">Mobile Money Number</label><input type="text" id="acc" oninput="generate()"></div>
        <div class="input-group"><label>Date of Transfer</label><input type="text" id="date" placeholder="DD/MM/YYYY" oninput="generate()"></div>
    </div>

    <div id="output" class="output-box">
        <div class="copy-card">
            <div class="clearfix"><label style="float:left;">Recipient Emails</label><span id="b1" class="badge">COPIED</span><button class="btn-copy" onclick="copy('outEmail', 'b1')">Copy</button></div>
            <pre id="outEmail" style="color: #0369a1; font-weight: bold; margin-top:10px;"></pre>
        </div>
        <div class="copy-card">
            <div class="clearfix"><label style="float:left;">Subject Line</label><span id="b2" class="badge">COPIED</span><button class="btn-copy" onclick="copy('outSub', 'b2')">Copy</button></div>
            <pre id="outSub" style="margin-top:10px;"></pre>
        </div>
        <div class="copy-card">
            <div class="clearfix"><label style="float:left;">Email Body</label><span id="b3" class="badge">COPIED</span><button class="btn-copy" onclick="copy('outBody', 'b3')">Copy Body</button></div>
            <pre id="outBody" style="margin-top:10px;"></pre>
        </div>
    </div>
</div>

<script>
    const partnerDatabase = {
        "NG_ZENITH": "international.transfers@zenithbank.com;ftinflows@zenithbank.com;Abayomi.Ireyomi@zenithbank.com;Henrietta.Ajayi@zenithbank.com;SUNDAY.AWOTUNDE@zenithbank.com;FATIMA.ADEMOLA-ASUNI@zenithbank.com",
        "NG_ACCESS": "contactcenter@accessbankplc.com;remittances@accessbankplc.com;worldremit@accessbankplc.com;paymentplatformssupport@accessbankplc.com",
        "GH_ABSA": "AbsaWorldremitOps@absa.africa;GH.Remittance@absa.africa",
        "PH_GCASH": "cicopartnersupport@gcash.com;partner-settlement@gcash.com"
    };

    function generate() {
        const key = document.getElementById('partnerKey').value;
        const service = document.getElementById('service').value;
        const issue = document.getElementById('issue').value;
        
        const txn = document.getElementById('txnNum').value || "[ ]";
        const ref = document.getElementById('ref').value || "[ ]";
        const name = document.getElementById('name').value || "[Name]";
        const amt = document.getElementById('amt').value || "[Amount]";
        const acc = document.getElementById('acc').value || "[Number/Account]";
        const date = document.getElementById('date').value || "[Date]";

        // Update Account Label based on service
        const label = document.getElementById('accLabel');
        if (service === "Momo") label.innerText = "Mobile Money Number";
        else if (service === "Bank") label.innerText = "Account Number";
        else label.innerText = "Recipient Mobile Number";

        if (!key) { document.getElementById('output').style.display = 'none'; return; }
        document.getElementById('output').style.display = 'block';
        document.getElementById('outEmail').innerText = partnerDatabase[key];

        let subject = "";
        let body = "Dear Partner,\n\n";

        if (issue === "funds") {
            subject = `Funds Not Received - Transaction Number ${txn} | ${service === "Momo" ? "Partner ID" : "Third Party Reference"} ${ref}`;
            if (service === "Momo") {
                body += `Please assist with the transaction below, as the recipient is claiming non-receipt of funds. Please share with us the proof of deposit:\n\n- Date of Transfer: ${date}\n- Recipient Name: ${name}\n- Amount: ${amt}\n- Mobile Money Number: ${acc}`;
            } else if (service === "Bank") {
                body += `Please assist with the transaction below, as the recipient is claiming non-receipt of funds. Please share with us the proof of deposit:\n\n- Date of Transfer: ${date}\n- Recipient Bank Name: [Insert Bank Name]\n- Recipient Account Number: ${acc}\n- Amount: ${amt}`;
            } else {
                body += `Please assist with the transaction that has been marked as collected, but the recipient has not received the funds. Please share with us the proof of delivery.\n\n- Recipient Name: ${name}\n- Amount: ${amt}\n- Recipient Mobile Number: ${acc}`;
            }
        } else if (issue === "reversal") {
            subject = `Funds Not Received - Transaction Number ${txn} | Third Party Reference ${ref}`;
            body += `Please check if a reversal can be requested, as funds were sent to an inactive/incorrect account.\n\n- Date of Transfer: ${date}\n- Recipient Name: ${name}\n- Amount: ${amt}\n- Recipient Mobile Number: ${acc}`;
        } else if (issue === "assist") {
            subject = `Recipient Assistance Required - Transaction Number ${txn} | Third Party Reference ${ref}`;
            body += `The recipient is having trouble collecting the funds for ${txn}. Kindly assist the recipient in collecting the funds.\n\n- Date of Transfer: ${date}\n- Recipient Name: ${name}\n- Amount: ${amt}\n- Recipient Mobile Number: ${acc}`;
        } else if (issue === "status") {
            subject = `Status Confirmation Request Transaction Number ${txn} | Third Party Reference ${ref}`;
            body += `Please confirm the final status of the transaction below, as it has been over the processing time, and the user has been reaching out to check.\n\n- Date of Transfer: ${date}\n- Recipient Name: ${name}\n- Amount: ${amt}\n- Recipient Mobile Number: ${acc}`;
        }

        body += `\n\nKindly investigate the current status and provide an update at your earliest convenience.\n\nBest regards,`;
        
        document.getElementById('outSub').innerText = subject;
        document.getElementById('outBody').innerText = body;
    }

    function copy(id, bId) {
        navigator.clipboard.writeText(document.getElementById(id).innerText);
        const b = document.getElementById(bId); b.style.display = 'inline';
        setTimeout(() => b.style.display = 'none', 1000);
    }
</script>
</body>
</html>
